services:
  postgreDev:
    image: postgres:17.4
    ports:
      - "${POSTGREDEV_PORT:-8004}:5432"
    volumes:
      - ./files/docker/postgreDev/init.sql:/docker-entrypoint-initdb.d/init.sql
    #      - ./files/docker/postgreDev/data:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10